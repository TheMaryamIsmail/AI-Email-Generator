<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Generator</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(56, 189, 248, 0.2);
            --sky-blue: #38bdf8;
            --sky-blue-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--sky-blue);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        input, select, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--sky-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-generate {
            grid-column: span 2;
            background: var(--sky-blue);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-generate:hover {
            background: var(--sky-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .output-section {
            margin-top: 35px;
            display: none;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-header h3 {
            font-size: 1.1rem;
            color: var(--sky-blue);
        }

        .btn-copy {
            background: transparent;
            border: 1px solid var(--sky-blue);
            color: var(--sky-blue);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .output-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #e2e8f0;
            max-height: 350px;
            overflow-y: auto;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 25px;
            color: var(--sky-blue);
            font-weight: 600;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width, .btn-generate {
                grid-column: span 1;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AI Email Generator</h1>
            <p>Powered by Google Gemini API & FastAPI</p>
        </header>

        <form id="emailForm" onsubmit="handleGenerate(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="recipient">Recipient / Target Audience</label>
                    <input type="text" id="recipient" placeholder="e.g., Hiring Manager, Client, Professor" required>
                </div>

                <div class="form-group">
                    <label for="tone">Tone of Voice</label>
                    <select id="tone" required>
                        <option value="Professional & Formal">Professional & Formal</option>
                        <option value="Friendly & Casual">Friendly & Casual</option>
                        <option value="Persuasive & Sales-Oriented">Persuasive & Sales-Oriented</option>
                        <option value="Direct & Concise">Direct & Concise</option>
                        <option value="Appreciative">Appreciative</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="purpose">Email Purpose / Subject Summary</label>
                    <input type="text" id="purpose" placeholder="e.g., Following up on software engineering interview" required>
                </div>

                <div class="form-group full-width">
                    <label for="key_points">Key Points to Cover</label>
                    <textarea id="key_points" placeholder="Mention enthusiasm, reference project X, request feedback by Friday..." required></textarea>
                </div>

                <button type="submit" class="btn-generate" id="submitBtn">Generate Email Draft</button>
            </div>
        </form>

        <div class="loader" id="loader">Generating intelligent email draft with Gemini...</div>

        <div class="output-section" id="outputSection">
            <div class="output-header">
                <h3>Generated Email Result</h3>
                <button class="btn-copy" onclick="copyToClipboard()">Copy Text</button>
            </div>
            <div class="output-box" id="outputBox"></div>
        </div>
    </div>

    <script>
        async function handleGenerate(event) {
            event.preventDefault();

            const recipient = document.getElementById('recipient').value;
            const tone = document.getElementById('tone').value;
            const purpose = document.getElementById('purpose').value;
            const key_points = document.getElementById('key_points').value;

            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const outputSection = document.getElementById('outputSection');
            const outputBox = document.getElementById('outputBox');

            // UI state: Loading
            submitBtn.disabled = true;
            loader.style.display = 'block';
            outputSection.style.display = 'none';

            try {
                const response = await fetch('/generate-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ recipient, tone, purpose, key_points })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to generate email.');
                }

                outputBox.textContent = data.email;
                outputSection.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputBox').textContent;
            navigator.clipboard.writeText(outputText).then(() => {
                const copyBtn = document.querySelector('.btn-copy');
                copyBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyBtn.textContent = 'Copy Text';
                }, 2000);
            });
        }
    </script>
</body>
</html>
